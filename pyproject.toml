[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "crypto-statarb-research"
version = "0.2.0"
description = "Bias-conscious crypto perpetual pairs research and paper simulation"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24,<3", "pandas>=2.0,<3", "scipy>=1.10,<2", "statsmodels>=0.14,<1", "matplotlib>=3.7,<4"]
[project.optional-dependencies]
exchange = ["ccxt>=4.3,<5"]
test = ["pytest>=7,<10", "nbformat>=5,<6"]
[project.scripts]
statarb = "statarb.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
testpaths = ["tests"]
